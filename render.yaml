services:
  - type: web
    name: cert-master
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    rootDir: ./
    # Release phase: runs with production env vars (DB + Supabase) present.
    preDeployCommand: "python manage.py migrate --noinput && python manage.py collectstatic --noinput"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - fromDatabase:
          name: cert-master-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
        generateValue: false
      - key: ALLOWED_HOSTS
        value: cert-master.onrender.com
        generateValue: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://oauther-fqj8.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://oauther-fqj8.vercel.app
    autoDeploy: true

